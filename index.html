<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amelias rymdchallenge</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#eef2fa;margin:0;display:flex;justify-content:center;color:#17253b}.card{background:#fff;max-width:640px;width:94%;min-height:88vh;margin:18px auto;border-radius:20px;padding:24px;box-shadow:0 5px 25px #20305020}h1{font-size:28px}p{line-height:1.55}button{width:100%;display:block;padding:15px;border:0;border-radius:13px;background:#e6eaf2;font-size:17px;text-align:left;margin:10px 0;cursor:pointer}button.primary{background:#213c7b;color:white;text-align:center;font-weight:750}button:disabled{cursor:default}.correct{background:#d4f3df!important}.wrong{background:#ffe0e0!important}.pill{border-radius:12px;background:#f0f4ff;padding:13px;margin:15px 0}.small{color:#64748b;font-size:14px}.bar{height:9px;background:#e6e8f0;border-radius:20px;overflow:hidden}.fill{height:100%;background:#375bc0;width:0}.hidden{display:none}.feedback{padding:15px;background:#fff5d9;border-radius:12px;margin-top:16px;line-height:1.5}</style></head><body><main class="card"><section id="home"><h1>🌍 Amelias rymdchallenge</h1><p>Träna inför NO-provet med frågor från skolans papper om solen, planeterna, tiden, månen och universum.</p><div class="pill">Inga tidspressade frågor. Efter varje svar får du en förklaring. Resultatet sparas på den här enheten.</div><button onclick="start('learn')">📚 Träna & förstå – 15 frågor</button><button onclick="start('exam')">🏆 Provutmaning – 20 frågor</button><button onclick="start('wrong')">🎯 Repetera frågor som blivit fel</button><p id="high" class="small"></p></section><section id="quiz" class="hidden"><button onclick="home()">← Avsluta</button><p class="small" id="progress"></p><div class="bar"><div class="fill" id="fill"></div></div><h1 id="question"></h1><div id="options"></div><div id="feedback"></div><button class="primary hidden" id="next" onclick="next()">Nästa →</button></section><section id="end" class="hidden"><h1>🌟 Snyggt jobbat!</h1><div id="result"></div><button class="primary" onclick="start('exam')">🏆 Nytt prov</button><button onclick="home()">← Tillbaka till menyn</button></section></main><script>const bank=[{"q": "Varför har vi årstider?", "a": "Jordaxelns lutning när jorden kretsar runt solen", "opts": ["Jordaxelns lutning när jorden kretsar runt solen", "Jorden är alltid närmare solen på sommaren", "Månen skuggar jorden", "Solen slocknar ibland"], "why": "Jordaxeln lutar ungefär 23,5 grader."}, {"q": "Hur mycket lutar jordaxeln ungefär?", "a": "23,5 grader", "opts": ["23,5 grader", "5 grader", "90 grader", "60 grader"], "why": "Lutningen påverkar hur solljuset träffar jorden."}, {"q": "Varför blir det dag och natt?", "a": "Jorden roterar runt sin axel", "opts": ["Jorden roterar runt sin axel", "Månen roterar runt solen", "Solen rör sig runt jorden varje dygn", "Jorden stannar på natten"], "why": "Jorden roterar ett varv på ungefär 24 timmar."}, {"q": "Hur lång är ett dygn?", "a": "Ungefär 24 timmar", "opts": ["Ungefär 24 timmar", "Ungefär 7 dagar", "Ungefär 30 dagar", "Ungefär 365 dagar"], "why": "Ett dygn hör ihop med jordens rotation."}, {"q": "Vad är ett år?", "a": "Ett varv för jorden runt solen", "opts": ["Ett varv för jorden runt solen", "Ett varv för månen runt jorden", "Ett varv runt jordaxeln", "En månfas"], "why": "Ett år är ungefär 365 och ett kvarts dygn."}, {"q": "Varför finns skottår?", "a": "Året är lite längre än 365 dygn", "opts": ["Året är lite längre än 365 dygn", "Månen har 13 faser", "Solen behöver en extra dag", "Jorden byter riktning"], "why": "Därför läggs oftast en extra dag till i februari vart fjärde år."}, {"q": "Ungefär hur lång tid går det mellan två nymånar?", "a": "29,5 dygn", "opts": ["29,5 dygn", "24 timmar", "7 dagar", "365 dagar"], "why": "Månens fascykel är ungefär 29,5 dygn."}, {"q": "Vad är nymåne och fullmåne?", "a": "Två av månens faser", "opts": ["Två av månens faser", "Två olika månar", "Olika årstider", "Olika stjärnor"], "why": "Faserna beror på hur stor del av månens solbelysta sida vi ser."}, {"q": "Varför lyser månen?", "a": "Den reflekterar solens ljus", "opts": ["Den reflekterar solens ljus", "Den är en liten sol", "Den skapar ljus av luft", "Jorden skickar ljus till den"], "why": "Månen avger inget eget synligt ljus som solen."}, {"q": "Varför ser vi nästan alltid samma sida av månen?", "a": "Månens rotation tar ungefär lika lång tid som ett varv runt jorden", "opts": ["Månens rotation tar ungefär lika lång tid som ett varv runt jorden", "Månen roterar inte alls", "Solen döljer baksidan", "Jorden är stilla"], "why": "Detta kallas bunden rotation."}, {"q": "Vad är ett ljusår?", "a": "Ett avstånd", "opts": ["Ett avstånd", "En tidszon", "En sorts månad", "Ett dygn"], "why": "Ett ljusår är sträckan ljuset färdas på ett år."}, {"q": "Vad är en satellit?", "a": "Något som går i bana runt en himlakropp", "opts": ["Något som går i bana runt en himlakropp", "En exploderande stjärna", "En sorts komet", "En planet med ringar"], "why": "Satelliter kan vara naturliga eller konstgjorda."}, {"q": "Vad kan konstgjorda satelliter användas till?", "a": "Väder, kommunikation och forskning", "opts": ["Väder, kommunikation och forskning", "Att stoppa jordens rotation", "Att göra månen ljusare", "Att ändra jordens lutning"], "why": "Vissa satelliter används även för navigation."}, {"q": "Vad betyder vakuum?", "a": "Nästan tomt utrymme med extremt lite materia", "opts": ["Nästan tomt utrymme med extremt lite materia", "Ett rum fyllt med luft", "Mycket vatten", "En kraftig vind"], "why": "Rymden är till stor del nästan tom och har mycket lågt tryck."}, {"q": "Vad är Polstjärnan känd för?", "a": "Den visar ungefär riktningen norr", "opts": ["Den visar ungefär riktningen norr", "Den visar söder", "Den är vår närmaste planet", "Den kretsar runt jorden"], "why": "Polstjärnan är nära himlens nordpol."}, {"q": "Varför kan kometer få en svans?", "a": "Solvärmen frigör gas och stoft", "opts": ["Solvärmen frigör gas och stoft", "De har en motor", "Jorden drar ut en svans", "Månen skickar rök"], "why": "Solens strålning och solvinden påverkar gasen och stoftet."}, {"q": "Vad är en geocentrisk världsbild?", "a": "En äldre modell med jorden i centrum", "opts": ["En äldre modell med jorden i centrum", "En modell med solen i centrum", "En teori om svarta hål", "En modell utan planeter"], "why": "Historiskt trodde man att solen och planeterna kretsade runt jorden."}, {"q": "Vad är en heliocentrisk världsbild?", "a": "En modell med solen i centrum för solsystemet", "opts": ["En modell med solen i centrum för solsystemet", "En modell med jorden i centrum", "En modell med månen i centrum", "En modell utan sol"], "why": "Planeterna i vårt solsystem kretsar runt solen."}, {"q": "Varför är atmosfären viktig?", "a": "Den ger livsviktiga gaser, lufttryck och skydd", "opts": ["Den ger livsviktiga gaser, lufttryck och skydd", "Den stoppar natt", "Den får solen att lysa", "Den håller månen på plats"], "why": "Atmosfären hjälper också till att reglera temperaturen."}, {"q": "Vad handlar Big bang om?", "a": "Universums tidiga heta, täta tillstånd och expansion", "opts": ["Universums tidiga heta, täta tillstånd och expansion", "När solen exploderade", "När jorden bildades", "När månen försvann"], "why": "Universum har expanderat i cirka 13,8 miljarder år."}, {"q": "Vad består solen främst av?", "a": "Mycket het gas eller plasma", "opts": ["Mycket het gas eller plasma", "Is", "Sten", "Vatten"], "why": "Solen är en stjärna, främst av väte och helium."}, {"q": "Hur får växter energi från solen?", "a": "Genom fotosyntes", "opts": ["Genom fotosyntes", "Genom jordens rotation", "Genom satelliter", "Genom kometer"], "why": "Solljus används av växter för att bilda energirika ämnen."}, {"q": "Hur hänger vattenkraft ihop med solen?", "a": "Solen driver vattnets kretslopp", "opts": ["Solen driver vattnets kretslopp", "Solen laddar turbiner direkt", "Månen skapar allt regn", "Det finns inget samband"], "why": "Solen värmer upp vatten som avdunstar och senare faller som nederbörd."}, {"q": "Vilken planet ligger närmast solen?", "a": "Merkurius", "opts": ["Merkurius", "Venus", "Jorden", "Mars"], "why": "Ordningen börjar Merkurius, Venus, Jorden och Mars."}, {"q": "Vilken planet ligger efter jorden från solen?", "a": "Mars", "opts": ["Mars", "Venus", "Saturnus", "Uranus"], "why": "Mars är den fjärde planeten från solen."}, {"q": "Vilken planet är särskilt känd för sina ringar?", "a": "Saturnus", "opts": ["Saturnus", "Merkurius", "Venus", "Mars"], "why": "Saturnus har ett mycket tydligt ringsystem."}, {"q": "Vad kallas vår naturliga satellit?", "a": "Månen", "opts": ["Månen", "Solen", "Polstjärnan", "Mars"], "why": "Månen rör sig i bana runt jorden."}, {"q": "Vad händer med universum enligt observationer?", "a": "Det utvidgas", "opts": ["Det utvidgas", "Det krymper alltid", "Det står helt stilla", "Det kretsar runt jorden"], "why": "På stor skala ökar avståndet mellan många galaxer."}];let mode,pool,i,score,correct,answered,misses;function get(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch(e){return fallback}}function put(k,v){localStorage.setItem(k,JSON.stringify(v))}function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function view(id){['home','quiz','end'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}function home(){view('home');document.getElementById('high').textContent='Personligt rekord: '+get('amelia-space-high',0)+' / 200 poäng'}function start(m){mode=m;let ids=m==='wrong'?get('amelia-space-misses',[]):bank.map((_,i)=>i);if(!ids.length){alert('Inga fel att repetera ännu!');return}pool=shuffle(ids).slice(0,m==='exam'?20:15);i=0;score=0;correct=0;misses=[];view('quiz');draw()}function draw(){if(i>=pool.length){finish();return}answered=false;const q=bank[pool[i]];document.getElementById('question').textContent=q.q;document.getElementById('progress').textContent=(i+1)+' av '+pool.length+' • '+score+' poäng';document.getElementById('fill').style.width=(i/pool.length*100)+'%';document.getElementById('feedback').innerHTML='';document.getElementById('next').classList.add('hidden');const box=document.getElementById('options');box.replaceChildren();shuffle(q.opts).forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(o,b);box.appendChild(b)})}function answer(v,b){if(answered)return;answered=true;const id=pool[i],q=bank[id],ok=v===q.a;let wrong=new Set(get('amelia-space-misses',[]));if(ok){score+=10;correct++;wrong.delete(id)}else{misses.push(id);wrong.add(id)}put('amelia-space-misses',[...wrong]);for(const btn of document.getElementById('options').children){btn.disabled=true;if(btn.textContent===q.a)btn.classList.add('correct')}if(!ok)b.classList.add('wrong');const fb=document.createElement('div');fb.className='feedback';const t=document.createElement('strong');t.textContent=ok?'✅ Rätt!':'💡 Rätt svar: '+q.a;fb.append(t);const p=document.createElement('p');p.textContent=q.why;fb.append(p);document.getElementById('feedback').replaceChildren(fb);document.getElementById('next').classList.remove('hidden');document.getElementById('next').textContent=i===pool.length-1?'Visa resultat →':'Nästa fråga →'}function next(){if(answered){i++;draw()}}function finish(){view('end');if(mode==='exam'&&score>get('amelia-space-high',0))put('amelia-space-high',score);const target=document.getElementById('result');target.replaceChildren();const p=document.createElement('p');p.innerHTML='<strong>'+correct+' av '+pool.length+' rätt • '+score+' poäng</strong>';target.append(p);const note=document.createElement('p');note.textContent=misses.length?'Frågor du missade: '+misses.map(x=>bank[x].q).join(' • '):'Full pott på den här rundan!';target.append(note)}home();</script></body></html>
